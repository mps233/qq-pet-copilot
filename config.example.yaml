# QQ 宠物自动化助手配置（示例）
# 复制为 config.yaml 后按需修改；config.yaml 不入库。

adb:
  # adb 可执行文件路径；留空则自动搜索 PATH 和常见安装目录（相对路径相对项目根目录）
  path: "resources/scrcpy-win64/adb.exe"
  # 设备序列号；留空则使用第一台在线设备
  device_serial: ""

# 界面设置（仅 GUI 使用，调度器不读）
gui:
  # 主题：跟随系统 / 深色 / 浅色
  theme: 跟随系统
  # 画面镜像开关（主页工具栏开关状态持久化）
  mirror: true

# 控制方案：injectInputEvent（默认，uiautomator2 d.touch，走 u2 server 事件注入）/
# minitouch（openstf minitouch socket 本地直发触摸事件，模拟器上 d.click 不可靠时更稳）
control:
  method: injectInputEvent

# 模拟器信息（异常恢复"重启设备"时自动探测实例用；serial 匹配到多个实例时用于消歧，
# 全部留空/auto 则纯自动探测，参考 ALAS EmulatorInfo）
emulator:
  # 模拟器类型：auto 自动探测，或 MuMuPlayer12 / MuMuPlayer / MuMuPlayerX /
  # LDPlayer3 / LDPlayer4 / LDPlayer9 / NoxPlayer / NoxPlayer64 /
  # BlueStacks4 / BlueStacks5 / MEmuPlayer
  type: auto
  # 实例名称（留空自动探测）
  name: ""
  # 模拟器安装路径（留空自动探测）
  path: ""
  # MuMu 机型伪装（需 Root，改写 app 级机型映射让 QQ 以真机身份运行；默认关闭，
  # 门禁 MMKV 补丁已翻转过的设备无需开启）
  device_spoof: false

school:
  # 属性点课程选择：力量 / 智力 / 魅力
  attribute: "力量"
  # 课时档位：短课 / 长课（按课程轮播卡位选：卡1-3=短课、卡4-6=长课、卡7=夏令营）。
  # 各学院分钟数不同（初级10/30、高级30/90…），实际时长选课后自动从面板读取并结算
  duration: "短课"
  # 每天学习次数上限，0 为不限；进度按天持久化，中途停止后重跑会接着计数
  times_per_day: 0

work:
  # 打工地点（OCR 文字匹配），如：风铃旅社 / 星尘魔法塔 / 彩虹画室
  location: "风铃旅社"
  # 打工时长选择：10分钟（select_box_1）/ 45分钟（select_box_2）/ 2小时（select_box_3），
  # 打工与雇佣好友共用
  duration: 45分钟
  # 每天打工次数上限，0 为不限；进度按天持久化，中途停止后重跑会接着计数
  times_per_day: 0
  # 找雇佣按钮时向下拖动的次数上限，超过仍未找到则关闭雇佣界面直接开工
  employ_scroll_limit: 5
  # 打工时优先雇佣的名字（宠物名或主人名，支持部分匹配）；留空 = 自动选收益最高
  hire_name: ""
  # 等好友空闲再雇佣：上面这个好友"出门中/被雇佣中"（正打工/学习）时不换人——
  # 点头像进主页读剩余时间，延后到好友空闲再雇佣（期间先跑冒险/护理等其他任务）；
  # "对方今天很累了"是当天不可雇，等待无意义，仍换收益最高的人
  hire_wait: false

schedule:
  # ===== 今日配额：当天想怎么花掉「学习+打工」共享的那份总预算 =====
  # 0 = 今天不做该项。只学习填 8/0；只打工填 0/8；各半填 4/4（到点自动切换）。
  # 与下面的停止点是 AND 关系：配额先到就切另一项，停止点到点则两项一起停。
  study_quota_hours: 8
  work_quota_hours: 8
  # ===== 疲劳与效率档（游戏机制，仅影响收益，不影响能不能跑）=====
  # 学习+打工合计达到门槛后当日收益降档：>8h 降到 25%、>12h 降到 10%。
  efficiency_tier1_hours: 8
  efficiency_tier2_hours: 12
  # ===== 停止点：合计时长达到后今天不再做该项（跑不跑）=====
  # 想「学满 8h 后继续吃 25% 档打工到 12h」就设 8 / 12；0 = 不限
  daily_hour_limit: 8
  work_stop_hours: 12
  # 金币阈值：主页 OCR 金币 >= 该值优先学习，低于该值先打工，赚够再学习
  # （仅在「今日配额」允许学习时生效；配额为 0 则直接跳过学习）
  coin_threshold: 2000
  # 旧版字段（仅首次运行迁移用，不再参与调度、不进设置页）：
  # 学习/打工点数系数 = 每节/每次的分钟数，老进度只有次数时据此换算时长
  school_factor: 20
  work_factor: 45
  # 进行中状态（上课/打工/冒险/被雇佣）的统一检查间隔（秒）
  check_interval: 15
  # 鼓励次数：在学习/打工进行中页面快速点击"鼓励宠物"按钮的次数，0 为不鼓励
  encourage_times: 10
  # 主页面检测次数：连续这么多次识别不到主页面标志（金币胶囊）才允许点 back
  # （主页面点 back 会退出游戏；默认 1 = 识别不到立即点 back，即原逻辑）
  main_page_checks: 1
  # 返回方式：系统返回（Android 返回键）/ 返回图标（定位游戏内 back 按钮点击）
  back_method: 系统返回
adventure:
  # 每天冒险次数，0 为不冒险
  times_per_day: 1
  # 冒险调度时间（HH:MM）：当天到达该时间后执行器优先处理冒险，
  # 当天次数用完后自动等第二天的该时间再冒险
  start_time: "08:00"
  # 开始冒险 6 秒后检测冒险详情框：出现"天色不对"就点召回 -> 确认召回，
  # 计入一次冒险完成；false 则照常等冒险结束
  skip_bad_weather: false

care:
  # 护理方式：ocr检测（读宠物状态，低于阈值手动喂食/洗澡）/
  # 一键护理（不读状态，直接点主页面的一键护理按钮，点完清空状态缓存里的体力/清洁/心情/饼干/香皂）
  method: 一键护理
  # 体力阈值：调度任务前检查，低于该值则喂食到达标
  energy_threshold: 60
  # 清洁阈值：调度任务前检查，低于该值则洗澡到达标
  clean_threshold: 60
  # 护理间隔（秒）：距上次护理检查至少间隔这么久才再次检查
  interval_seconds: 60

visit:
  # 每天踩踩次数，0 为不踩；进度按天持久化
  times_per_day: 10
  # 踩踩调度时间（HH:MM）：到达后开始处理；场景等待间隙（上课/打工进行中）也会插空处理
  start_time: "00:01"

pk:
  # 每天 PK 次数，0 为不 PK；每个好友可 PK 3 次，打完自动切换下一个好友
  times_per_day: 15
  # PK 调度时间（HH:MM）：到达后开始处理
  start_time: "00:01"
  # PK 目标过滤：只打这些好友（玩家昵称或宠物名，逗号分隔，部分匹配）；留空 = 不限
  only_names: ""
  # PK 目标过滤：跳过这些好友（玩家昵称或宠物名，逗号分隔，部分匹配）；留空 = 不跳过
  skip_names: ""
  # PK 目标过滤：等级上限（0 = 不限；-1 = 只打等级比自己低的；-2 = 只打比雇佣打手低的；
  #   正数 = 只打等级 ≤ N 的；-1/-2 整轮没打成时兜底放宽为任意等级再跑一轮）
  max_level: 0
  # PK 打手（保镖）：只雇这些好友的宠物代打（宠物名/主人名，逗号分隔，按优先级）；留空 = 不自动管理
  helper_names: ""
  # 打手兜底：helper_names 名单里的都不可雇时——
  #   true  = 自动兜底雇「宠友列表」里战力最高的可雇宠物代打
  #   false = 不雇，直接自己上（已雇的若还在任会先用完，到期不再续）
  helper_fallback: false

friend_care:
  # 启用好友护理开关
  enabled: false
  # 好友护理时间段（HH:MM-HH:MM）：到达开始时间后访问指定好友家护理，
  # 到结束时间退出场景；支持跨零点（如 22:00-02:00）
  time_range: "14:00-19:30"
  # 护理好友名称（好友列表 content-desc "好友 xxx" 里匹配，支持部分匹配）
  friend_name: ""
  # 护理好友方式：ocr检测（读好友状态面板，体力/清洁护理到 90）/
  # 一键护理（点好友页的一键护理按钮）
  method: ocr检测
  # 调度间隔（秒）：每次调度只做一次护理巡检，距上次巡检至少间隔这么久才再次调度
  interval_seconds: 60

hire_friend:
  # 雇佣好友开关
  enabled: false
  # 雇佣好友时间段（HH:MM-HH:MM，支持跨零点）：时间段内才调度雇佣
  time_range: "19:31-23:59"
  # 雇佣好友调度间隔（秒）：距上次调度至少间隔这么久才再次调度（收尾后快速接下一轮）
  interval_seconds: 5
  # 雇佣好友名称（好友列表 content-desc "好友 xxx" 里匹配，支持部分匹配）
  friend_name: ""
  # 每天雇佣好友次数，0 为不雇佣；进度按天持久化
  times_per_day: 8

# 调度引擎：task_queue（任务队列调度，默认）/ legacy（老主循环调度，可无缝切回）
runner:
  engine: task_queue

# 任务调度：顺序（> 分隔，越靠前越优先，不在 order 里的任务不调度）+ 每任务调度设置
# 可选任务名：care(护理) adventure(冒险) visit(踩踩) pk(PK)
#   hire_friend(好友雇佣) friend_care(好友护理) school(学习) work(打工)
tasks:
  order: care>school>friend_care>hire_friend>adventure>visit>pk>work
  # 主任务组（冒险/学习/打工/雇佣好友互斥，不能同时做）组内优先级：
  # > 分隔，越靠前越优先；没列出的主任务按默认顺序兜底排最后。
  # 注意：这里只是"逐个检查的顺序"，任务还要自身条件满足才会执行
  # （学习要金币达标 + 未超时长上限 + 未疲劳；打工要 enabled 且未达 work_stop_hours 等），
  # 排第一不等于一定跑——条件不满足会自动落到后面的任务。
  # 本行含义：学习 > 雇佣好友 > 冒险 > 打工（有冒险次数就先冒险）
  main_order: school>hire_friend>adventure>work
  # 所有任务统一的失败重试间隔（秒）：设置页"任务失败重试间隔"可改，
  # 覆盖原来各任务单独的 failure_interval
  failure_interval: 1800
  # trigger: interval=按间隔秒数（interval_seconds 为最小执行间隔）/
  #   daily=按每日时间点列表（到点打开执行窗口，窗口内可反复执行直到当天任务完成；
  #   下一个时间点重新打开窗口）
  # enabled_time_range: 允许执行的时间窗（HH:MM:SS-HH:MM:SS）
  # success_interval: 成功/失败后距下次执行的最小间隔（秒）；
  # failure_interval 已统一为下面的 failure_interval（设置页"任务失败重试间隔"）
  care:
    enabled: true
    trigger: interval
    interval_seconds: 60
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  adventure:
    enabled: true
    trigger: daily
    daily_times: ["09:10"]
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  visit:
    enabled: true
    trigger: daily
    daily_times: ["00:01"]
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  pk:
    enabled: true
    trigger: daily
    daily_times: ["00:01"]
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  # 好友雇佣/好友护理的时间条件由各自配置段决定（hire_friend.time_range /
  # friend_care.time_range），这里用 interval 触发即可
  hire_friend:
    enabled: true
    trigger: interval
    interval_seconds: 60
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  friend_care:
    enabled: true
    trigger: interval
    interval_seconds: 60
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  school:
    enabled: true
    trigger: interval
    interval_seconds: 60
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60
  work:
    enabled: true
    trigger: interval
    interval_seconds: 60
    enabled_time_range: 00:00:00-23:59:59
    success_interval: 60

recover:
  # 异常恢复方式：重启设备（adb reboot，彻底）/ 重启游戏（只强停并重开 QQ，快）
  method: 重启设备
  # 模拟器重启命令（模拟器模式"重启设备"用）：MuMu 不支持 adb reboot（会把 adb 服务卡死），
  # 配了则改为执行该命令重启模拟器整机；留空自动探测 MuMu 实例分步停/启
  # （src/emulator.py，shutdown -> launch），探测不到才回退 adb reboot
  # 例（MuMu 12）："D:/Netease/MuMu Player 12/shell/MuMuManager.exe" control -v 0 restart
  emulator_restart_cmd: ""

employed:
  # 被雇佣开关：开启后按时间段+检查间隔出门检查是否被雇佣中
  enabled: false
  # 被雇佣时间段（HH:MM-HH:MM，支持跨零点）：时间段内定时检查，
  # 且主任务（冒险/学习/打工/雇佣好友）不触发
  time_range: "19:31-23:59"
  # 被雇佣检查间隔（秒）：距上次检查至少间隔这么久才再次出门检查
  interval_seconds: 60
  # 被雇佣后处理：等到25/75（分成到 雇佣者<=25% 被雇佣者>=75% 才召回，收益最高）/
  # 等到25/75（小于45min）（面板剩余时间 >45 分钟立即召回，<=45 分钟继续等到25/75）/
  # 立刻召回（进被雇佣面板直接点"现在召回"）
  action: 等到25/75（小于45min）

career:
  # 隐藏职业解锁哨兵：每节课结算后读职业树，监控武术家/梦境旅人/大明星是否解锁；
  # 解锁时记录事件（仪表盘「职业」页横幅 + Hermes 定时推 Telegram 通知）
  watch: true
  # 发现解锁后自动停止学习（关闭 tasks.school.enabled；日志/仪表盘会注明哨兵触发）
  stop_study_on_unlock: true
  # 兜底检查间隔（分钟）：除每节课结算后检查外，每隔这么久也检查一次；0 = 只每节课后查
  check_interval_min: 60
  # 监控的目标职业线（逗号分隔）
  careers: 武术家,梦境旅人,大明星

notify:
  # 场景多次重试仍失败时的告警通知（主任务通知后调度器退出，需人工查看）
  # Windows 桌面 Toast 通知：true/false
  win_toast: true
  # OnePush 推送配置（YAML，设置页里是多行输入框；留空不推送），
  # 支持 Bark / PushPlus / Server酱 / Telegram / SMTP / 自定义 webhook 等，例如：
  #   onepush_config: "{provider: bark, key: 你的Key}"
  # 各提供方参数配置教程：
  # https://github.com/LmeSzinc/AzurLaneAutoScript/wiki/Onepush-configuration-%5BCN%5D
  onepush_config: ""
  # ---- 飞书群机器人（推荐：配置简单，国内直连）----
  # 用法：飞书群 → 设置 → 群机器人 → 添加机器人 → 自定义机器人，复制 webhook 地址
  # 安全设置选「签名校验」时把密钥填到 feishu_secret；选「自定义关键词」可留空
  # （关键词需包含"QQ宠物"，否则飞书会拒收）
  feishu_enabled: false
  feishu_webhook: ""
  feishu_secret: ""
  # ---- Telegram Bot ----
  # 用法：@BotFather 发 /newbot 建机器人拿 Token；先给机器人发一条消息，
  # 再用 @userinfobot 查自己的 Chat ID（群/频道是 -100 开头的负数）
  telegram_enabled: false
  telegram_token: ""
  telegram_chat_id: ""
  # 隐藏职业（武术家/梦境旅人/大明星）解锁时是否推送（含职业树截图）
  # 用上面已启用的渠道；也可在仪表盘「设置 → 通知」里点「发送测试通知」验证
  career_notify: true
  # 异常降级提醒（如同类错误 30 分钟一条）
  error_notify: true
